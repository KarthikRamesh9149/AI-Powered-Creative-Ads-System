[project]
name = "ai-powered-creative-ads-system"
version = "0.1.0"
description = "Streamlit dashboard for generating and managing AI-powered ad creative sets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.58,<2",
    "requests>=2.34,<3",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
